[project]
name = "inspector-backend"
version = "0.0.1"
description = "Android UI Inspector Backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "websockets==16.0",
    "setuptools<84",
    "lxml>=5.0.0",
    "slowapi>=0.1.9",
    "mitmproxy>=12.2.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "I",      # isort
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "ISC",    # flake8-implicit-str-concat
    "PIE",    # flake8-pie
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific rules
]
ignore = [
    "ISC001", # conflicts with formatter for multi-line strings
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["F401", "TCH", "E501", "SIM117", "E741"]
"test_*.py" = ["F401", "TCH", "E501", "SIM117", "E741"]
"device/android_bridge.py" = ["E402", "E741", "RUF034", "E501"]
"device/ios_bridge.py" = ["RUF001", "RUF002", "E501"]
"device/recorder.py" = ["E501"]
"device/accessibility_utils.py" = ["E501"]
"network/mitm_manager.py" = ["E501"]
"network/routes.py" = ["E501"]
